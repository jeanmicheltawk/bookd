@if (current(); as item) {
  <div class="lightbox" (click)="close()" role="dialog" aria-modal="true" [attr.aria-label]="item.title || 'Portfolio media'">
    <button class="lightbox__close" type="button" (click)="close(); $event.stopPropagation()" aria-label="Close">✕</button>

    @if (items().length > 1) {
      <button class="lightbox__nav lightbox__nav--prev" type="button" (click)="prev($event)" aria-label="Previous">‹</button>
      <button class="lightbox__nav lightbox__nav--next" type="button" (click)="next($event)" aria-label="Next">›</button>
    }

    <figure class="lightbox__stage" (click)="$event.stopPropagation()">
      @if (item.media_type === 'video') {
        <video [src]="src(item)" [poster]="item.thumbnail_url ? api.assetUrl(item.thumbnail_url) : ''" controls autoplay></video>
      } @else if (isPdf(item)) {
        @if (pdfUrl(); as url) {
          <iframe [src]="url" [title]="item.title || 'Portfolio PDF'"></iframe>
        } @else {
          <div class="lightbox__pdf-fallback">
            <span class="lightbox__pdf-badge">PDF</span>
            <p>{{ item.title || 'Document' }}</p>
          </div>
        }
        <a class="lightbox__pdf-open" [href]="src(item)" target="_blank" rel="noopener">Open PDF ↗</a>
      } @else {
        <img [src]="src(item)" [alt]="item.title || 'Portfolio piece'" />
      }
      @if (items().length > 1) {
        <figcaption>
          <span class="lightbox__count">{{ (index() ?? 0) + 1 }} / {{ items().length }}</span>
        </figcaption>
      }
    </figure>
  </div>
}
