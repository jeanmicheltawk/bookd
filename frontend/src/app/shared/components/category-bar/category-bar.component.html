@if (categories().length) {
  <div class="cat-bar">
    @if (canScrollLeft()) {
      <button type="button" class="cat-bar__arrow cat-bar__arrow--prev" (click)="scrollBy(-1)" aria-label="Show previous categories">
        <span aria-hidden="true">←</span>
      </button>
    }
    <div #track class="cat-bar__track" (scroll)="updateArrows()">
      <a
        routerLink="/"
        [queryParams]="{ view: null, category: null, country: null, availability: null, verified: null, gender: null, q: null, page: null }"
        class="cat-bar__chip"
        [class.active]="isHaus()"
      >
        Haus
      </a>
      <a
        routerLink="/"
        [queryParams]="{ view: 'all' }"
        class="cat-bar__chip"
        [class.active]="isAllCreatives()"
      >
        All Creatives
      </a>
      @for (cat of categories(); track cat.id) {
        <a
          routerLink="/"
          [queryParams]="{ category: cat.slug }"
          class="cat-bar__chip"
          [class.active]="isCategoryActive(cat.slug)"
        >
          {{ cat.name }}
        </a>
      }
    </div>
    @if (canScrollRight()) {
      <button type="button" class="cat-bar__arrow cat-bar__arrow--next" (click)="scrollBy(1)" aria-label="Show next categories">
        <span aria-hidden="true">→</span>
      </button>
    }
  </div>
}
