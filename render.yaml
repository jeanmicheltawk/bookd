databases:
  - name: bookd-haus-db
    databaseName: bookd_haus
    user: bookd
    plan: basic-256mb

services:
  - type: web
    name: bookd-haus
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm run setup && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookd-haus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: https://bookdhaus.com
      - key: ADMIN_EMAIL
        value: admin@bookd.com
      - key: ADMIN_PASSWORD
        value: bookdadmin
      - key: UPLOAD_DIR
        value: uploads
      - key: APP_URL
        value: https://bookdhaus.com
      - key: EMAIL_APP_URL
        value: https://bookdhaus.com
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: info@bookdhaus.com
      - key: SMTP_FROM
        value: info@bookdhaus.com
      - key: NOTIFY_EMAIL
        value: info@bookdhaus.com
      - key: SMTP_PASS
        sync: false
      - key: WHISH_ENV
        value: sandbox
      - key: WHISH_WEBSITE_URL
        value: ille.co
      - key: WHISH_CHANNEL
        sync: false
      - key: WHISH_SECRET
        sync: false
      - key: WHISH_USER_AGENT
        value: BookdHaus/1.0 (https://bookdhaus.com; info@bookdhaus.com)
