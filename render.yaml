databases:
  - name: bookd-haus-db
    databaseName: bookd_haus
    user: bookd
    plan: basic-256mb

services:
  - type: web
    name: bookd-haus
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm run setup && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookd-haus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: https://jeanmicheltawk.github.io
      - key: ADMIN_EMAIL
        value: admin@bookd.com
      - key: ADMIN_PASSWORD
        value: bookdadmin
      - key: UPLOAD_DIR
        value: uploads
